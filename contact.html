<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>

  <body>

    <h1>Contact Us</h1>

    <form action="emailto:roshan200@gmail.com?subject=Hi" enctype="text/plain" method="post">

      <p>

        <label for="email">Email</label>
        <input type="email" name="mail" placeholder="@example.com" id="email">

      </p>
      <p>

        <label for="username">Username</label>
        <input maxlength="20" type="text" placeholder="Enter Name" id="username" required>

      </p>

      <p>

        <label for="male">Male</label>
        <input value="male" type="radio" name="gender" id="male">

        <label for="female">Female</label>
        <input value="female" type="radio" name="gender" id="female">

      </p>
      <p>
      <h3>Select your Habits</h3>
      <label for="Dance">Dance</label>
      <input value="Dance" type="checkbox" name="habits" id="Dance">

      <label for="sing">Sing</label>
      <input value="sing" type="checkbox" name="habits" id="sing">

      </p>

      <p>
        <select name="country" id="country">
          <option value="nepal">Nepal</option>
          <option value="India">India</option>
          <option value="nepal">China</option>
          <optgroup label="Select Asian Country">
            <option value="srilanka">srilanka</option>
            <option value="maldives">Maldives</option>
          </optgroup>
        </select>
      </p>
      <p>
        <textarea cols="30" rows="10" name="msg" id="" placeholder="type message"></textarea>
      </p>

      <p>
        <label for="date">Please Provide Date:-</label>
        <input type="date" name="date" id="data">
      </p>
      <button>Submit</button>
      <button>Reset</button>

    </form>

  </body>

</html>
